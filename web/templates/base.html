<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Daily Bulletin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="{{ url_for('index') }}">&#128240; Daily Bulletin</a>
    <a href="{{ url_for('podcast') }}" style="color:#a0c4ff;margin-left:24px;font-size:14px;font-weight:600;text-decoration:none;">🎙️ Podcast</a>
  </nav>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>&copy; {{ 2026 }} Daily Bulletin &mdash; <a href="#">Privacy Policy</a></p>
  </footer>
</body>
</html>
