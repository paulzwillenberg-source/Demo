{% extends "base.html" %}
{% block title %}Edit Preferences – Daily Bulletin{% endblock %}

{% block content %}
<div class="form-card">
  <h2>Edit your preferences</h2>

  <form method="post" action="{{ url_for('preferences', uid=user.id) }}">

    <div class="form-group">
      <label for="name">First name</label>
      <input type="text" id="name" name="name" value="{{ user.name }}" placeholder="e.g. Sarah" />
    </div>

    <fieldset class="form-group">
      <legend>Topics <span class="required">*</span></legend>
      <div class="topic-grid">
        {% for topic in topics %}
        <label class="topic-checkbox">
          <input type="checkbox" name="topics" value="{{ topic }}"
            {% if topic in user.topics %}checked{% endif %} />
          <span class="topic-label">
            {% if topic == 'news' %}📰{% elif topic == 'politics' %}🏛️{% elif topic == 'business' %}💼{% elif topic == 'marketing' %}📣{% elif topic == 'celebrity' %}⭐{% endif %}
            {{ topic | title }}
          </span>
        </label>
        {% endfor %}
      </div>
    </fieldset>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Save Preferences</button>
      <a class="btn btn-secondary" href="{{ url_for('dashboard', uid=user.id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
