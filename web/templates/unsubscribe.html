{% extends "base.html" %}
{% block title %}Unsubscribe – Daily Bulletin{% endblock %}

{% block content %}
<div class="form-card narrow center-text">
  <h2>We're sorry to see you go</h2>
  <p>
    Are you sure you want to unsubscribe <strong>{{ user.email }}</strong> from
    the Daily Bulletin?
  </p>
  <form method="post" action="{{ url_for('unsubscribe', uid=user.id) }}">
    <div class="form-actions center">
      <button type="submit" class="btn btn-danger">Yes, Unsubscribe Me</button>
      <a class="btn btn-secondary" href="{{ url_for('dashboard', uid=user.id) }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
